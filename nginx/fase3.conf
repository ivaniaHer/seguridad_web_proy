# Sitio de la Fase 3. instalar.sh reemplaza los valores __ENTRE_GUIONES__.

# HTTP -> HTTPS (Fase 2)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/fase3/public;
    index index.php;

    server_tokens off;          # no revela la versión de nginx
    client_max_body_size 1m;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Bloquea archivos ocultos (.git, .env, .htaccess...). Va antes que PHP:
    # nginx evalúa las ubicaciones con expresión regular en orden.
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_hide_header X-Powered-By;
    }

    # Laboratorio vulnerable (Fase 4). Solo existe si se instaló con --laboratorio.
    # Sin CSP para que los ataques de demostración funcionen.
    location ^~ /laboratorio/ {
        add_header X-Laboratorio "inseguro-solo-para-demostracion" always;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:__PHP_SOCK__;
        }
    }
}
